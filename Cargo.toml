[package]
name = "htn-plan-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A planner-independent validator for IPC HTN plans"
license = "Apache-2.0"

[[bin]]
name = "bell"
path = "src/main.rs"

[dependencies]
hddl_analyzer = { git = "https://github.com/koala-planner/HDDL-Parser.git", rev = "da428787df7c18e83825ad98d42996ead0397832" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
